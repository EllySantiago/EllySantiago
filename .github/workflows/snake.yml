name: Gerar cobrinha dos commits

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6a0dad&color_dots=#ebedf0,#d8b4fe,#b57bff,#8a2be2,#4b0082
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#b57bff&color_dots=#161b22,#4b2e83,#6a0dad,#8a2be2,#b57bff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
